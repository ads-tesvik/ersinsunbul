:root{

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
header{background:var(--dark);color:#fff;padding:22px 18px;text-align:center}

.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(31,56,100,.08)}

.mode:hover{border-color:var(--mid);background:#F0F5FD}

.mode span{font-size:.78rem;color:#666;display:block;margin-top:2px}
.best{font-size:.72rem;color:var(--green);font-weight:600}
.h2{color:var(--dark);font-size:1.1rem;margin-bottom:14px;border-left:4px solid var(--red);padding-left:10px}
.bar{height:8px;background:#E4E9F2;border-radius:4px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--mid);transition:.3s}
.qmeta{display:flex;justify-content:space-between;font-size:.82rem;color:#666;margin-bottom:10px;flex-wrap:wrap;gap:6px}
.stem{font-size:1.05rem;font-weight:600;line-height:1.5;margin-bottom:16px}
.opt{display:block;width:100%;text-align:left;background:#F7F9FC;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:9px;cursor:pointer;font-size:.98rem;line-height:1.45;transition:.12s}
.opt:hover:not(:disabled){border-color:var(--mid);background:#F0F5FD}
.opt .ltr{display:inline-block;min-width:24px;font-weight:700;color:var(--mid)}
.opt.ok{background:var(--ok);border-color:var(--okb)}
.opt.ok .ltr{color:var(--okb)}
.opt.bad{background:var(--bad);border-color:var(--badb)}
.opt.bad .ltr{color:var(--badb)}
.opt:disabled{cursor:default;opacity:.85}
.feedback{padding:10px 14px;border-radius:8px;font-size:.92rem;margin-top:12px;display:none}
.feedback.show{display:block}
.feedback.ok{background:var(--ok);color:var(--okb)}
.feedback.bad{background:var(--bad);color:var(--badb)}
.btn{display:inline-block;background:var(--dark);color:#fff;border:none;border-radius:8px;padding:12px 26px;font-size:1rem;cursor:pointer;margin-top:14px}
.btn:hover{background:var(--mid)}
.btn.ghost{background:#fff;color:var(--dark);border:1.5px solid var(--dark)}
.btn.ghost:hover{background:#F0F5FD}
.center{text-align:center}
.score-big{font-size:2.6rem;font-weight:800;color:var(--dark)}
.pct{font-size:1.1rem;color:#666;margin:6px 0 16px}
.review{margin-top:14px}
.review .rq{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#FAFBFE}
.review .rq b{color:var(--dark)}
.review .okans{color:var(--green);font-weight:600}
.review .badans{color:var(--red);font-weight:600}
.msg{font-size:.95rem;color:#555;margin:6px 0 16px}
footer{text-align:center;font-size:.78rem;color:#888;padding:20px}

function home() {
  modeKey = null;
  let html = '<div class="card"><div class="h2">Ünite Seçin</div><div class="grid">';
  for (const u of Object.keys(DATA.units)) {
    const b = getBest('u' + u);
    html += `<button class="mode" onclick="start('u${u}')"><b>Ünite ${u}</b>${esc(DATA.units[u])}<span>${b ? '<span class="best">En iyi: ' + b + '/' + Math.min(20, DATA.bank[u].length) + '</span>' : 'En iyi: —'}</span></button>`;
  }
  html += '</div></div>';
  html += '<div class="card"><div class="h2">Sınav Denemeleri (25 soru)</div><div class="grid">';
  html += `<button class="mode" onclick="start('vize')"><b>Vize Denemesi</b>Kapsam: Hafta 1-7 · her açılışta farklı 25 soru<span>${getBest('vize') ? '<span class="best">En iyi: ' + getBest('vize') + '/25</span>' : 'En iyi: —'}</span></button>`;
  html += `<button class="mode" onclick="start('final')"><b>Final Denemesi</b>Kapsam: Hafta 1-13 · her açılışta farklı 25 soru<span>${getBest('final') ? '<span class="best">En iyi: ' + getBest('final') + '/25</span>' : 'En iyi: —'}</span></button>`;
  html += '</div></div>';
  html += '<div class="card"><div class="h2">Nasıl Çalışılır?</div><p class="msg">Her denemede sorular ve seçenekler karıştırılır; vize ve final denemeleri her açılışta ilgili ünitelerden farklı 25 soru seçer. Cevabınızı seçtiğinizde anında doğru/yanlış geri bildirimi alırsınız. Yanlışlarınız sonuç ekranında doğru cevaplarıyla birlikte listelenir. En iyi skorunuz bu tarayıcıda saklanır.</p></div>';
  app.innerHTML = html;
}

/* Deneme: ilgili ünitelerden sırayla (dengeli) ve rastgele 25 soru */
function examPool(k) {
  const banks = shuffle(DATA.exam[k]).map(u => shuffle(DATA.bank[String(u)]).map(q => ({ q: q.q, o: q.o, c: q.c, unit: u })));
  const out = [];
  for (let r = 0; out.length < 25; r++) {
    let added = false;
    for (const b of banks) { if (r < b.length && out.length < 25) { out.push(b[r]); added = true; } }
    if (!added) break;
  }
  return out;
}

function start(k) {
  modeKey = k;
  let pool;
  if (k === 'vize' || k === 'final') {
    pool = examPool(k);
  } else {
    const u = k.slice(1);
    pool = DATA.bank[u].map(q => ({ q: q.q, o: q.o, c: q.c, unit: Number(u) }));
  }
  qs = shuffle(pool).map(q => {
    const order = shuffle(q.o.map((_, i) => i));
    return { q: q.q, o: order.map(i => q.o[i]), c: order.indexOf(q.c), unit: q.unit };
  });
  idx = 0; score = 0; wrong = [];
  renderQ();
}

function renderQ() {
  if (idx >= qs.length) { result(); return; }
  const q = qs[idx];
  const total = qs.length;
  const pct = Math.round((idx / total) * 100);
  const uLabel = q.unit === 'vize' ? 'Vize' : (q.unit === 'final' ? 'Final' : 'Ünite ' + q.unit);
  let html = `<div class="card">`;
  html += `<div class="bar"><i style="width:${pct}%"></i></div>`;
  html += `<div class="qmeta"><span><b>Soru ${idx + 1} / ${total}</b></span><span>${uLabel} · Doğru: ${score}</span></div>`;
  html += `<div class="stem">${esc(q.q)}</div>`;
  q.o.forEach((o, oi) => {
    html += `<button class="opt" id="opt${oi}" onclick="choose(${oi})"><span class="ltr">${LETTERS[oi]})</span> ${esc(o)}</button>`;
  });
  html += `<div class="feedback" id="fb"></div><div class="center"><button class="btn" id="nextBtn" style="display:none" onclick="nextQ()">Sonraki</button></div></div>`;
  app.innerHTML = html;
}

function choose(oi) {
  const q = qs[idx];
  const btns = document.querySelectorAll('.opt');
  btns.forEach((b, i) => {
    b.disabled = true;
    if (i === q.c) b.classList.add('ok');
    if (i === oi && oi !== q.c) b.classList.add('bad');
  });
  const fb = document.getElementById('fb');
  if (oi === q.c) { score++; fb.className = 'feedback ok show'; fb.textContent = '✔ Doğru!'; }
  else { wrong.push({ ...q, given: oi }); fb.className = 'feedback bad show'; fb.textContent = '✘ Yanlış. Doğru cevap: ' + LETTERS[q.c] + ') ' + q.o[q.c]; }
  document.getElementById('nextBtn').style.display = 'inline-block';
  document.querySelector('.qmeta').innerHTML = `<span><b>Soru ${idx + 1} / ${qs.length}</b></span><span>Ünite ${q.unit} · Doğru: ${score}</span>`;
}

function nextQ() { idx++; renderQ(); }

function result() {
  const total = qs.length;
  const pct = Math.round((score / total) * 100);
  setBest(modeKey, score);
  let msg = pct >= 90 ? 'Mükemmel! Bu üniteye hâkimsiniz.' : pct >= 75 ? 'Çok iyi — küçük eksikleri tamamlayın.' : pct >= 60 ? 'İyi bir başlangıç; yanlışları tekrar edin.' : 'Eksikleriniz var; ders notuna dönüp yanlış konuları tekrar çalışın.';
  let html = `<div class="card center"><div class="score-big">${score} / ${total}</div><div class="pct">%${pct} başarı</div><div class="msg">${msg}</div>`;
  html += `<button class="btn" onclick="start('${modeKey}')">Tekrar Dene</button> <button class="btn ghost" onclick="home()">Ana Menü</button></div>`;
  if (wrong.length) {
    html += '<div class="card"><div class="h2">Yanlışlarınız (' + wrong.length + ')</div><div class="review">';
    wrong.forEach(w => {
      html += `<div class="rq"><b>${esc(w.q)}</b><br><span class="badans">Sizin cevabınız: ${LETTERS[w.given]}) ${esc(w.o[w.given])}</span><br><span class="okans">Doğru cevap: ${LETTERS[w.c]}) ${esc(w.o[w.c])}</span></div>`;
    });
    html += '</div></div>';
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

home();
</script>
</body>
</html>
